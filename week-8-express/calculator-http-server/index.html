<!DOCTYPE html>
<html>
<head>
    <script>
        async function add(){
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            // document.getElementById("response").innerHTML = parseInt(a) + parseInt(b);

            //path parameter way
            // const res = await fetch("http://localhost:3003/sum/" +a +"/"+b)
            // const json = await res.json()
            // document.getElementById("response").innerHTML = json.ans;
            

            //payload way
            const res = await fetch("http://localhost:3003/sum/" ,{
                method:"POST",
                headers:{
                    "Content-Type": "application/json"
                }, body: JSON.stringify( {
                a:a,
                b:b
            }),
           
            });
            const json = await res.json()
            document.getElementById("response").innerHTML = json.ans;
        }
    </script>
</head>
<body>

    <input id="first" type="text" placeholder="Enter first no">
    <input id="second" type="text" placeholder="Enter second no">

    <input type="button" value="Sum" onclick="add()">

    <div id="response"></div>

</body>
</html>
