<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</script>
</head>
<body>
    <div style="display: flex; justify-content: space-between ; padding: 0px 100px;">
        <div id="notes">
            Loading...
        </div>
        <div>
            <input type="text" id="userNote">
            <button onclick="addTodo()">Create new note</button>
        </div>
    </div>
    <script>

        async function addTodo(){
            axios.post("http://localhost:3002/notes",{
                note: document.getElementById("userNote").value
            })

            //show the todo in the frontend
            const newNode = document.createElement("div");
            newNode.innerHTML = document.getElementById("userNote").value ;
            newNode.setAttribute("style", "border: 2px solid black; padding: 10px;")
            document.getElementById("notes").appendChild(newNode);
            

            //make the box empty again
            document.getElementById("userNote").value="";

        }


        async function getTodos(){
            //we can fetch data by two ways . fetch and axios
            //fetch is a global fucntion . axios is built on top of fetch and cleaner than fetch
            //fetch comes default in the broweser
            //axios is a external dependecy which someone written and I'm bringing to my codebases

            //fetch ways

            
                // const response = await fetch("http://localhost:3002/notes")
                // const json = await response.json()
                // console.log(json.notes);
            

                //Second way --Axios 
                const response = await axios.get("http://localhost:3002/notes")
                const notes = response.data.notes;

                document.getElementById("notes").innerHTML = "";
                for (let i = 0; i< notes.length; i++){
                    const noteNote = document.createElement("div");
                    noteNote.innerHTML = notes[i];
                    noteNote.setAttribute("style", "border: 2px solid black; padding: 10px;")
                    document.getElementById("notes").appendChild(noteNote);
                }

        };
        getTodos();
    </script>
</body>
</html>
